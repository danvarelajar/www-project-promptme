# PromptMe challenge registry — OWASP Top 10 for LLM Applications 2026
#
# The dashboard, the launcher and the solver harness all read this file.
# Each challenge keeps its 2025 ID in `was` so older material still maps.
#
# models:   default model names per role. Override them per server in the
#           dashboard settings, or with PROMPTME_CHAT_MODEL /
#           PROMPTME_EMBED_MODEL in the environment.
# port:     where the challenge listens (5000 + its 2026 number).
# entry:    the challenge's Flask app, relative to the repo root.
# flag_sha256: hash of the flag, so the dashboard can check submissions
#           without the flag being written here in plain text.

models:
  chat: qwen3:4b-instruct   # Apache 2.0; fallback: llama3.2:3b
  embed: nomic-embed-text

