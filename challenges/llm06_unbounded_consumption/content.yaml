# Hints drawer content for LLM06:2026 Unbounded Consumption.
# Fill in the text below; the Hints button appears on the challenge page
# once the risk text or a hint is filled in. See challenges/llm01_prompt_injection/content.yaml
# for a finished example. Plain text; keep each hint to one or two sentences.

# "About this risk": what the OWASP 2026 risk is (2-3 sentences) and its impact
# (one sentence). Shown at the top of the drawer on both levels.
risk: |
  An LLM application lets requests consume resources without limits: tokens, model calls, tool calls or compute. Agents that plan and fan out work can multiply the cost of a single request many times over. A budget that is displayed but not enforced protects no one.
  Impact: denial of service, runaway bills (denial of wallet) and slower service for everyone else.

level1:
  # Three hints, revealed one at a time:
  #   1. nudge: where to look, without naming the technique
  #   2. technique: the weakness in this app and why it exists
  #   3. almost there: what to try, short of the exact input
  # The working attack for this level is in tools/solvers.py (solve_llm06).
  - "Use Mica Research Desk to understand how it works. Review what the model sees."
  - "There must be a way to make the agent overload its response. Sub-tasks are key."
  - "Ask the model to overuse sub-tasks to increase token consumption."
