<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ post.title }} · Kestrelline news</title>
  <link rel="stylesheet" href="/_pm/pm.css">
</head>
<body>
  <main class="pm-main">
    <article class="pm-wrap pm-stack" style="max-width:720px">
      <span class="eyebrow">Kestrelline news · {{ post.at }} · {{ post.author }}</span>
      <h1>{{ post.title }}</h1>
      <div style="white-space:pre-wrap">{{ post.body }}</div>
    </article>
  </main>
</body>
</html>
