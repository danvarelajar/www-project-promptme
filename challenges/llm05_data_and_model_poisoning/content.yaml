# Hints drawer content for LLM05:2026 Data and Model Poisoning.
# Fill in the text below; the Hints button appears on the challenge page
# once a hint is filled in. See challenges/llm01_prompt_injection/content.yaml
# for a finished example. Plain text; keep each hint to one or two sentences.

# "About this risk": what the OWASP 2026 risk is (2-3 sentences) and its impact
# (one sentence, starting "Impact:"). Shown under the challenge title as
# "What it is" and "Why it matters", on both levels.
risk: |
  Attackers manipulate the data a model learns from or relies on: pre-training data, fine-tuning data, or the documents fed into its knowledge base. Poisoned data can bias answers, plant false facts or create hidden triggers. Whoever can edit a source the model trusts can shape what it tells everyone else.
  Impact: wrong or harmful answers delivered with full confidence to many users.

level1:
  # Three hints, revealed one at a time:
  #   1. nudge: where to look, without naming the technique
  #   2. technique: the weakness in this app and why it exists
  #   3. almost there: what to try, short of the exact input
  # The working attack for this level is in tools/solvers.py (solve_llm05).
  - "Review the wiki and its content. Does the model take the information as it is?"
  - "The wiki seems to be open for anyone to edit. There is no control."
  - "Edit the OWASP Top 10 for LLM Applications page in the wiki and change the number one risk everywhere it appears."
