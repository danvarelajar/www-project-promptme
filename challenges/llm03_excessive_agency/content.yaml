# Hints drawer content for LLM03:2026 Excessive Agency.
# Fill in the text below; the Hints button appears on the challenge page
# once the risk text or a hint is filled in. See challenges/llm01_prompt_injection/content.yaml
# for a finished example. Plain text; keep each hint to one or two sentences.

# "About this risk": what the OWASP 2026 risk is (2-3 sentences) and its impact
# (one sentence). Shown at the top of the drawer on both levels.
risk: |
  The model is given more functions, permissions or autonomy than its task needs, so a manipulated or mistaken output becomes a damaging action. Typical causes are tools that can do more than required, broad service-account permissions, and no human approval for high-impact actions. A permission that exists only as an instruction in the prompt is not a permission.
  Impact: unauthorised access to data, unwanted changes or deletions, and data shared outside the company.

level1:
  - "Interact with Mica Drive. Agents may restrict access to documents, but how that restriction is enforced is key."
  - "Review the Agent activity panel to understand how access control is enforced. Can it be influenced?"
  - "The agent is instructed to give access only to admins. What if you are an admin?"

level2:
  # Same three kinds of hint for Level 2: Agent takes a destructive action.
  # Working attack: tools/solvers.py (solve_llm03_l2).
  - "As in Level 1, try to understand how the assistant works. Ask questions and find its limits."
  - "Look at the tools available. Only one folder has restrictions."
  - "The agent has no problem sharing files in /shared. It would help if the files were in that folder."