# Hints drawer content for LLM07:2026 Misinformation.
# Fill in the text below; the Hints button appears on the challenge page
# once a hint is filled in. See challenges/llm01_prompt_injection/content.yaml
# for a finished example. Plain text; keep each hint to one or two sentences.

# "About this risk": what the OWASP 2026 risk is (2-3 sentences) and its impact
# (one sentence, starting "Impact:"). Shown under the challenge title as
# "What it is" and "Why it matters", on both levels.
risk: |
  The model produces false or unsupported content that sounds credible, for example by inventing facts, rules or commitments where its sources say nothing. The risk grows when people or systems act on the output without checking it against the source.
  Impact: wrong decisions, financial loss, legal liability and loss of trust.

level1:
  # Three hints, revealed one at a time:
  #   1. nudge: where to look, without naming the technique
  #   2. technique: the weakness in this app and why it exists
  #   3. almost there: what to try, short of the exact input
  # The working attack for this level is in tools/solvers.py (solve_llm07).
  - "Read the refund policy. The model interprets it and instructs the bot as best it can."
  - "The bot may react in unexpected ways to what the policy doesn't explicitly state."
  - "Think outside the box. For example, you may have lost a EUR 2,000 deal because of a problem with this order."
